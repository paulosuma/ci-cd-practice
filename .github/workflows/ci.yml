name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # checkout must come first: local actions live in the repo
      - name: Check out code
        uses: actions/checkout@v4
      - name: Lint (ruff)
        uses: ./.github/actions/python-lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Test (pytest, Python ${{ matrix.python }})
        uses: ./.github/actions/python-test
        with:
          python-version: ${{ matrix.python }}
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml
