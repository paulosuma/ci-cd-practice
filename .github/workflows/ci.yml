name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # checkout must come first: local actions live in the repo
      - name: Check out code
        uses: actions/checkout@v7
      - name: Lint (ruff)
        uses: ./.github/actions/python-lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Test (pytest, Python ${{ matrix.python }})
        uses: ./.github/actions/python-test
        with:
          python-version: ${{ matrix.python }}
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml

      - name: Upload coverage to Codecov
        # one upload per run is enough; the matrix cells measure the same code
        if: matrix.python == '3.12'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image locally and load it
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: cicd-practice:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test health endpoint
        shell: bash
        run: |
          cleanup() {
            docker rm -f ci-cd-practice-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name ci-cd-practice-smoke --publish 8000:8000 cicd-practice:ci
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 1
          done

          docker logs ci-cd-practice-smoke
          exit 1

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
