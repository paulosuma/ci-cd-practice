name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # checkout must come first: local actions live in the repo
      - name: Check out code
        uses: actions/checkout@v4
      - name: Lint (ruff)
        uses: ./.github/actions/python-lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Test (pytest, Python ${{ matrix.python }})
        uses: ./.github/actions/python-test
        with:
          python-version: ${{ matrix.python }}
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml

      - name: Upload coverage to Codecov
        # one upload per run is enough; the matrix cells measure the same code
        if: matrix.python == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
