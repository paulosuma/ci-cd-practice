name: Setup Python environment
description: Install Python (with pip caching) and the project's dev dependencies.

inputs:
  python-version:
    description: Python version to install
    default: "3.12"
  requirements-file:
    description: Requirements file to install
    default: requirements-dev.txt

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.requirements-file }}
    - name: Install dependencies
      shell: bash
      run: pip install -r "${{ inputs.requirements-file }}"
